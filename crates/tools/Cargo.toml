[package]
name = "myime-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MPL-2.0"

[[bin]]
name = "myime-tool"
path = "src/main.rs"

[dependencies]
myime-core = { path = "../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml_ng = "0.10"
