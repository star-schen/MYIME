[package]
name = "myime-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rime"]
# Disable only for safe Core tests/consumers without native Rime or the C ABI.
rime = []

[dependencies]
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
csv = "1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
